<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="320" rx="8" fill="#f8fafc"/>

  <!-- Attestations box -->
  <rect x="20" y="80" width="130" height="160" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="85" y="105" text-anchor="middle" font-weight="600" fill="#0c4a6e">Attestations</text>
  <text x="85" y="130" text-anchor="middle" font-size="11" fill="#475569">relevanceSnapshot</text>
  <text x="85" y="150" text-anchor="middle" font-size="11" fill="#475569">JSON parsed to</text>
  <text x="85" y="170" text-anchor="middle" font-size="11" fill="#475569">snapshot map</text>

  <!-- Arrow to RelevanceComposer -->
  <line x1="150" y1="160" x2="195" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- RelevanceComposer box -->
  <rect x="200" y="40" width="180" height="240" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="290" y="65" text-anchor="middle" font-weight="600" fill="#92400e">RelevanceComposer</text>
  <text x="290" y="85" text-anchor="middle" font-size="11" fill="#78350f">calls assessBatch()</text>
  <text x="290" y="100" text-anchor="middle" font-size="11" fill="#78350f">per factor</text>

  <!-- Per-item factor -->
  <rect x="215" y="115" width="150" height="50" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
  <text x="290" y="137" text-anchor="middle" font-size="11" font-weight="500" fill="#9a3412">OrgProximity</text>
  <text x="290" y="153" text-anchor="middle" font-size="10" fill="#78350f">per-item (default delegation)</text>

  <!-- Group-aware factor -->
  <rect x="215" y="175" width="150" height="50" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="290" y="197" text-anchor="middle" font-size="11" font-weight="500" fill="#991b1b">IndependenceAware</text>
  <text x="290" y="213" text-anchor="middle" font-size="10" fill="#7f1d1d">group-aware (overrides batch)</text>

  <!-- Product + floor label -->
  <text x="290" y="250" text-anchor="middle" font-size="11" fill="#78350f">∏ weights, floor at min</text>

  <!-- Arrow to TrustScoreComputer -->
  <line x1="380" y1="160" x2="425" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- TrustScoreComputer box -->
  <rect x="430" y="80" width="160" height="160" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="510" y="105" text-anchor="middle" font-weight="600" fill="#14532d">TrustScoreComputer</text>
  <text x="510" y="130" text-anchor="middle" font-size="11" fill="#166534">mass-preserving</text>
  <text x="510" y="150" text-anchor="middle" font-size="11" fill="#166534">normalisation</text>
  <text x="510" y="175" text-anchor="middle" font-size="11" fill="#166534">decay × confidence</text>
  <text x="510" y="195" text-anchor="middle" font-size="11" fill="#166534">× credibility</text>
  <text x="510" y="215" text-anchor="middle" font-size="11" fill="#166534">× norm_relevance</text>

  <!-- Arrow to Score -->
  <line x1="590" y1="160" x2="635" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Score box -->
  <rect x="640" y="120" width="60" height="80" rx="6" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="670" y="155" text-anchor="middle" font-weight="600" font-size="12" fill="#4c1d95">α / β</text>
  <text x="670" y="175" text-anchor="middle" font-size="11" fill="#6b21a8">Score</text>

  <!-- Title -->
  <text x="360" y="25" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Relevance Factor Pipeline</text>
</svg>
