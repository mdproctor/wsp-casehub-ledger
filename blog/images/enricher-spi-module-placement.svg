<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="dep" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="move" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="280" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Enricher SPI Module Placement</text>

  <!-- Module boxes -->
  <rect x="30" y="50" width="180" height="190" rx="6" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="120" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">api</text>
  <text x="120" y="86" text-anchor="middle" font-size="9" fill="#64748b">zero framework deps</text>

  <rect x="250" y="50" width="180" height="190" rx="6" fill="#fff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="340" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">ledger-core</text>
  <text x="340" y="86" text-anchor="middle" font-size="9" fill="#64748b">framework-neutral logic</text>

  <rect x="470" y="50" width="180" height="190" rx="6" fill="#fff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="560" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">runtime</text>
  <text x="560" y="86" text-anchor="middle" font-size="9" fill="#64748b">Quarkus CDI beans</text>

  <!-- Dependency arrows -->
  <line x1="250" y1="145" x2="215" y2="145" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#dep)"/>
  <line x1="470" y1="145" x2="435" y2="145" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#dep)"/>

  <!-- LedgerAttestationEnricher — always in api -->
  <rect x="45" y="100" width="150" height="32" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="120" y="120" text-anchor="middle" font-size="10" font-weight="500" fill="#166534">AttestationEnricher</text>

  <!-- LedgerEntryEnricher — moved from core to api -->
  <rect x="45" y="145" width="150" height="32" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="120" y="165" text-anchor="middle" font-size="10" font-weight="500" fill="#166534">EntryEnricher</text>

  <!-- Ghost of old location -->
  <rect x="265" y="145" width="150" height="32" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <text x="340" y="165" text-anchor="middle" font-size="10" fill="#dc2626" opacity="0.6">EntryEnricher</text>
  <line x1="265" y1="145" x2="415" y2="177" stroke="#ef4444" stroke-width="1" opacity="0.4"/>

  <!-- Move arrow -->
  <path d="M 265 161 C 230 161, 230 161, 200 161" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#move)"/>

  <!-- Consumer box -->
  <rect x="470" y="100" width="150" height="32" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
  <text x="545" y="115" text-anchor="middle" font-size="9" fill="#475569">consumer enrichers</text>
  <text x="545" y="127" text-anchor="middle" font-size="9" fill="#475569">implement both SPIs</text>

  <!-- Labels -->
  <text x="120" y="210" text-anchor="middle" font-size="9" fill="#16a34a">consumers can see these</text>
  <text x="340" y="210" text-anchor="middle" font-size="9" fill="#dc2626">consumers can't reach here</text>

  <!-- Legend -->
  <rect x="45" y="248" width="10" height="10" rx="2" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="62" y="257" font-size="9" fill="#475569">current location</text>
  <rect x="170" y="248" width="10" height="10" rx="2" fill="#fef2f2" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>
  <text x="187" y="257" font-size="9" fill="#475569">old location (removed)</text>
  <line x1="320" y1="253" x2="345" y2="253" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#dep)"/>
  <text x="352" y="257" font-size="9" fill="#475569">depends on</text>
</svg>
