<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="320" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Attestation Weight Chain</text>

  <!-- Factor boxes -->
  <rect x="20" y="55" width="130" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="85" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">Decay</text>
  <text x="85" y="96" text-anchor="middle" font-size="10" fill="#3b82f6">temporal recency</text>

  <rect x="175" y="55" width="130" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="240" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">Confidence</text>
  <text x="240" y="96" text-anchor="middle" font-size="10" fill="#3b82f6">self-reported certainty</text>

  <rect x="330" y="55" width="130" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="395" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Credibility</text>
  <text x="395" y="96" text-anchor="middle" font-size="10" fill="#b45309">attestor-scoped</text>

  <rect x="485" y="55" width="140" height="60" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="555" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Relevance</text>
  <text x="555" y="96" text-anchor="middle" font-size="10" fill="#16a34a">pair-scoped (new)</text>

  <!-- Multiply signs -->
  <text x="157" y="90" text-anchor="middle" font-size="18" fill="#475569">×</text>
  <text x="312" y="90" text-anchor="middle" font-size="18" fill="#475569">×</text>
  <text x="470" y="90" text-anchor="middle" font-size="18" fill="#475569">×</text>

  <!-- Arrow down to effective weight -->
  <line x1="360" y1="120" x2="360" y2="155" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Effective weight box -->
  <rect x="230" y="160" width="260" height="40" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="360" y="185" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">effective weight per attestation</text>

  <!-- Scope labels -->
  <text x="85" y="140" text-anchor="middle" font-size="9" fill="#64748b">per attestation</text>
  <text x="240" y="140" text-anchor="middle" font-size="9" fill="#64748b">per attestation</text>
  <text x="395" y="140" text-anchor="middle" font-size="9" fill="#64748b">per attestor</text>
  <text x="555" y="140" text-anchor="middle" font-size="9" fill="#64748b">per attestor × actor</text>

  <!-- Normalisation note -->
  <rect x="80" y="225" width="560" height="70" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="360" y="248" text-anchor="middle" font-size="11" font-weight="600" fill="#854d0e">Mass-preserving normalisation (relevance only)</text>
  <text x="360" y="266" text-anchor="middle" font-size="10" fill="#a16207">Relevance re-weights whose evidence dominates — never shrinks total evidence.</text>
  <text x="360" y="282" text-anchor="middle" font-size="10" fill="#a16207">Uniform relevance across a pass has zero effect on the score.</text>
</svg>
